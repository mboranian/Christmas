<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Christmas tree favicon with aggressive cache busting -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,4 12,12 20,12' fill='%23228B22'/%3E%3Cpolygon points='16,8 10,16 22,16' fill='%2332CD32'/%3E%3Cpolygon points='16,12 8,22 24,22' fill='%23228B22'/%3E%3Crect x='14' y='22' width='4' height='6' fill='%238B4513'/%3E%3Cpolygon points='16,2 15.2,4.8 12.4,4.8 14.6,6.4 13.8,9.2 16,7.6 18.2,9.2 17.4,6.4 19.6,4.8 16.8,4.8' fill='%23FFD700'/%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=6" type="image/svg+xml" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.svg?v=6" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg?v=6" />
    <link rel="mask-icon" href="%PUBLIC_URL%/favicon.svg?v=6" color="#228B22" />
    <meta name="msapplication-TileColor" content="#228B22" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e5631" />
    <meta
      name="description"
      content="780 Christmas Lists - Manage your Christmas gift lists and see what others want"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.svg" or "favicon.svg", "%PUBLIC_URL%/favicon.svg" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>780 Christmas Lists</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      // If an older service worker or cached files are causing the deployed site to show a blank page,
      // unregister any service workers and clear caches. This runs once on page load.
      (function(){
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs){
              regs.forEach(function(r){ r.unregister(); });
            }).catch(function(){});
          } catch(e) {}
        }
        if (window.caches && caches.keys) {
          try {
            caches.keys().then(function(keys){
              return Promise.all(keys.map(function(k){ return caches.delete(k); }));
            }).catch(function(){});
          } catch(e) {}
        }
      })();
    </script>
  </body>
</html>
